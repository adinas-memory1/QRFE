<div class="fiscal-receipt-actions d-inline-flex align-items-center">
  <c-dropdown variant="btn-group" class="fiscal-receipt-menu">
    <button
      cButton
      variant="ghost"
      size="sm"
      class="fiscal-receipt-menu-toggle"
      cDropdownToggle
      [caret]="false"
      type="button"
      [disabled]="busy"
      [attr.aria-label]="'client.fiscalReceiptPdf.menu' | transloco"
    >
      <svg cIcon name="cilOptions" size="sm"></svg>
    </button>
    <div cDropdownMenu>
      <button cDropdownItem type="button" (click)="requestDownload()">
        {{ 'client.fiscalReceiptPdf.download' | transloco }}
      </button>
      <button cDropdownItem type="button" (click)="requestEmail()">
        {{ 'client.fiscalReceiptPdf.email' | transloco }}
      </button>
    </div>
  </c-dropdown>
</div>

<app-fiscal-invoice-customer-modal
  [(visible)]="customerModalVisible"
  [submitting]="busy"
  [confirmLabelKey]="customerModalConfirmKey"
  [titleKey]="customerModalTitleKey"
  [requireEmail]="requireCustomerEmail"
  (confirm)="onCustomerConfirmed($event)"
/>
